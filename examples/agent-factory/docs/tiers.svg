<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <style>
    .ttl{font-size:14px;fill:#8b949e;letter-spacing:.14em}
    .k{font-size:13px;fill:#f0883e}
    .t{font-size:12px;fill:#adbac7}
    .n{font-size:11px;fill:#6e7681}
    .bar{fill:#f0883e}
  </style>
  <text x="20" y="26" class="ttl">EARNED AUTONOMY</text>

  <rect x="20" y="48"  width="6" height="30" class="bar" opacity=".25"/>
  <text x="42" y="62" class="k">C0</text><text x="90" y="62" class="t">shadow</text>
  <text x="200" y="62" class="n">runs on live work, ships nothing. compare against what actually happened</text>

  <rect x="20" y="88"  width="6" height="30" class="bar" opacity=".45"/>
  <text x="42" y="102" class="k">C1</text><text x="90" y="102" class="t">draft</text>
  <text x="200" y="102" class="n">writes, a human sends. every agent starts here</text>

  <rect x="20" y="128" width="6" height="30" class="bar" opacity=".7"/>
  <text x="42" y="142" class="k">C2</text><text x="90" y="142" class="t">approve</text>
  <text x="200" y="142" class="n">acts inside scope, one human click per run</text>

  <rect x="20" y="168" width="6" height="30" class="bar"/>
  <text x="42" y="182" class="k">C3</text><text x="90" y="182" class="t">autonomous</text>
  <text x="200" y="182" class="n">acts alone inside a spend envelope, with a kill switch</text>

  <text x="20" y="218" class="n">promotion needs proving-ground evidence plus production evidence. demotion is automatic on drift.</text>
</svg>
